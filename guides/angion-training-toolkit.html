<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#0f766e">
<title>Angion Training Toolkit &amp; Logger</title>
<meta name="description" content="A private, offline training companion for the Angion Method: session timer with metronome, daily check-ins, measurements, progress charts and a personalised schedule. All data stays in your browser.">
<style>
:root{
  --bg:#eef2f7; --surface:#ffffff; --surface-2:#f7fafc; --ink:#1e293b; --ink-2:#334155; --muted:#5b6b82; --faint:#94a3b8; --line:#e3e8f0; --line-2:#eef1f6;
  --brand:#0f766e; --brand-2:#14b8a6; --brand-soft:#e7f6f4; --brand-ink:#0b5c55;
  --blue:#2563eb; --blue-soft:#eaf1fe;
  --red:#c81e1e; --red-soft:#fdeeee;
  --amber:#a15c07; --amber-soft:#fff6e8;
  --green:#15803d; --green-soft:#eaf8ef;
  --violet:#6d28d9; --violet-soft:#f3eefe;
  --slate-soft:#eef2f7;
  --shadow-sm:0 1px 2px rgba(15,23,42,.06);
  --shadow:0 1px 2px rgba(15,23,42,.05),0 8px 24px rgba(15,23,42,.07);
  --shadow-lg:0 10px 40px rgba(15,23,42,.18);
  --radius:16px; --radius-sm:11px;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --safe-b:env(safe-area-inset-bottom,0px);
  --nav-h:64px; --rail-w:232px; --max:1080px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 var(--font);-webkit-font-smoothing:antialiased;overflow-wrap:break-word}
h1,h2,h3,h4{line-height:1.25;color:#0f172a;margin:0 0 .5em;letter-spacing:-.01em}
h1{font-size:1.5rem}h2{font-size:1.28rem}h3{font-size:1.06rem}h4{font-size:.95rem}
p{margin:0 0 1em}
a{color:var(--blue);text-underline-offset:2px}
small,.small{font-size:.84rem}
.muted{color:var(--muted)}
.faint{color:var(--faint)}
ul,ol{margin:0 0 1em;padding-left:1.25em}
li{margin:.2em 0}
hr{border:0;border-top:1px solid var(--line);margin:1.4rem 0}
svg{display:block;max-width:100%}
kbd{font:600 .8em var(--mono);background:var(--slate-soft);border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:.1em .4em}
.hidden{display:none!important}
[hidden]{display:none!important}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---- buttons & controls ---- */
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 .92rem var(--font);padding:.6rem 1rem;border-radius:11px;cursor:pointer;display:inline-flex;gap:.45rem;align-items:center;justify-content:center;transition:background .12s,border-color .12s,transform .05s;min-height:44px;line-height:1.1}
.btn:hover{border-color:#c7d0dd;background:var(--surface-2)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:3px solid #a7f3ef;outline-offset:1px}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:#0c6760}
.btn.danger{background:var(--red);border-color:var(--red);color:#fff}
.btn.danger:hover{background:#a81818}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--slate-soft)}
.btn.outline{background:transparent}
.btn.small{min-height:36px;padding:.4rem .7rem;font-size:.84rem;border-radius:9px}
.btn.block{width:100%}
.btn.lg{min-height:52px;font-size:1rem;padding:.7rem 1.2rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn-row{display:flex;flex-wrap:wrap;gap:8px}
.icon{width:1.2em;height:1.2em;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
label{font-size:.86rem;font-weight:600;color:var(--ink-2);display:block;margin-bottom:.3rem}
input,select,textarea{font:inherit;font-size:.95rem;padding:.6rem .7rem;border:1px solid #cfd8e3;border-radius:10px;background:var(--surface);color:var(--ink);width:100%;min-height:44px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand-2);box-shadow:0 0 0 3px #cdeeeb}
textarea{min-height:70px;resize:vertical}
input[type=checkbox],input[type=radio]{width:auto;min-height:0;accent-color:var(--brand)}
input[type=range]{min-height:0;padding:0;accent-color:var(--brand)}
.field{margin-bottom:.9rem}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}
@media(max-width:560px){.g3{grid-template-columns:repeat(2,1fr)}}
.inline{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap}

/* segmented control & chips */
.seg{display:inline-flex;background:var(--slate-soft);border:1px solid var(--line);border-radius:11px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{appearance:none;border:0;background:transparent;color:var(--ink-2);font:600 .85rem var(--font);padding:.45rem .7rem;border-radius:8px;cursor:pointer;min-height:38px}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--brand);box-shadow:var(--shadow-sm)}
.choice{display:flex;flex-wrap:wrap;gap:8px}
.choice label{display:inline-flex;align-items:center;gap:.4rem;margin:0;padding:.5rem .8rem;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-weight:600;color:var(--ink-2);cursor:pointer;min-height:42px}
.choice input{position:absolute;opacity:0;width:0;height:0}
.choice label:has(input:checked){background:var(--brand-soft);border-color:var(--brand-2);color:var(--brand-ink)}
.choice label:focus-within{box-shadow:0 0 0 3px #cdeeeb}

/* cards & pills */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-sm);padding:16px}
.card.pad{padding:18px}
.card h3{margin-top:0}
.tag{font-size:.7rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:.35rem;font-size:.74rem;font-weight:700;padding:.2rem .55rem;border-radius:999px;border:1px solid transparent;white-space:nowrap}
.pill.brand{color:var(--brand-ink);background:var(--brand-soft);border-color:#c3e9e3}
.pill.blue{color:var(--blue);background:var(--blue-soft);border-color:#cfdcfb}
.pill.green{color:var(--green);background:var(--green-soft);border-color:#c9ecd6}
.pill.amber{color:var(--amber);background:var(--amber-soft);border-color:#f6dfb8}
.pill.red{color:var(--red);background:var(--red-soft);border-color:#f6caca}
.pill.violet{color:var(--violet);background:var(--violet-soft);border-color:#ddd0f7}
.pill.grey{color:var(--muted);background:var(--slate-soft);border-color:var(--line)}
.dot{width:.5rem;height:.5rem;border-radius:50%;background:currentColor;flex:none}

/* stage badges */
.sb{display:inline-grid;place-items:center;border-radius:50%;font-weight:900;color:#fff;flex:none}
.sb.s{width:30px;height:30px;font-size:.9rem}.sb.m{width:44px;height:44px;font-size:1.2rem}.sb.l{width:60px;height:60px;font-size:1.7rem}
.cls-E{background:#64748b}.cls-D{background:#0ea5e9}.cls-C{background:#14b8a6}.cls-B{background:#22c55e}.cls-A{background:#f59e0b}.cls-S{background:#ef4444}.cls-X{background:#7c3aed}

/* callouts */
.note{border-radius:12px;padding:12px 14px;margin:1rem 0;border:1px solid var(--line);background:var(--slate-soft);font-size:.92rem}
.note>:last-child{margin-bottom:0}
.note.danger{background:var(--red-soft);border-color:#f3c4c4;color:#7f1d1d}
.note.warn{background:var(--amber-soft);border-color:#f3d9ae;color:#7a4504}
.note.info{background:var(--blue-soft);border-color:#cddcfb;color:#1e3a8a}
.note.tip{background:var(--brand-soft);border-color:#c3e9e3;color:var(--brand-ink)}
.note b{color:inherit}
.note .ttl{display:flex;gap:.45rem;align-items:center;font-weight:800;margin-bottom:.35rem}

/* ---- app shell ---- */
.app{min-height:100vh;min-height:100dvh}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px 16px;background:rgba(255,255,255,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.topbar .brand-mark{display:flex;align-items:center;gap:.5rem;font-weight:800;color:#0f172a;font-size:1rem}
.topbar .logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--brand),var(--blue));display:grid;place-items:center;color:#fff}
.topbar .sp{flex:1}
.topbar .daypill{font-size:.78rem;color:var(--muted);background:var(--slate-soft);border:1px solid var(--line);border-radius:999px;padding:.25rem .6rem;white-space:nowrap}
.iconbtn{appearance:none;border:1px solid var(--line);background:var(--surface);width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:var(--ink-2);cursor:pointer}
.iconbtn:hover{background:var(--surface-2)}

.shell{display:grid;grid-template-columns:1fr;max-width:var(--max);margin:0 auto}
@media(min-width:900px){.shell{grid-template-columns:var(--rail-w) minmax(0,1fr);gap:24px;padding:0 20px}}
.rail{display:none}
@media(min-width:900px){
  .rail{display:block;position:sticky;top:64px;align-self:start;height:calc(100vh - 64px);padding:16px 0;overflow:auto}
}
.rail nav{display:flex;flex-direction:column;gap:4px}
.rail .navbtn{display:flex;align-items:center;gap:.7rem;padding:.6rem .8rem;border-radius:11px;border:0;background:transparent;color:var(--ink-2);font:600 .95rem var(--font);cursor:pointer;width:100%;text-align:left}
.rail .navbtn:hover{background:var(--slate-soft)}
.rail .navbtn[aria-current=page]{background:var(--brand-soft);color:var(--brand-ink)}
.rail .navbtn .icon{width:1.25rem;height:1.25rem}
.rail .railfoot{margin-top:14px;padding:12px;border-top:1px solid var(--line);font-size:.8rem;color:var(--muted)}

main{min-width:0;padding:16px 16px calc(var(--nav-h) + var(--safe-b) + 28px);}
@media(min-width:900px){main{padding:20px 0 48px}}
.view{animation:fade .18s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.view-head{margin:4px 0 14px}
.view-head h1{margin:0}
.view-head p{margin:.2rem 0 0;color:var(--muted);font-size:.92rem}
.section{margin:22px 0}
.section>h2{display:flex;align-items:center;gap:.5rem;font-size:1.04rem;margin-bottom:.7rem}
.stack{display:flex;flex-direction:column;gap:12px}

/* bottom nav (mobile) */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
@media(min-width:900px){.tabbar{display:none}}
.tabbar button{flex:1;appearance:none;border:0;background:transparent;color:var(--muted);font:600 .68rem var(--font);display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px;cursor:pointer;min-height:var(--nav-h)}
.tabbar button .icon{width:1.45rem;height:1.45rem}
.tabbar button[aria-current=page]{color:var(--brand)}

/* progress ring & big clock (session) */
.ring-wrap{position:relative;width:min(70vw,260px);aspect-ratio:1;margin:0 auto}
.ring-wrap svg{width:100%;height:100%}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:12%}
.bigclock{font:800 clamp(2.4rem,11vw,3.6rem)/1 var(--mono);font-variant-numeric:tabular-nums;color:#0f172a}
.ring-sub{font-size:.8rem;color:var(--muted);margin-top:2px}

/* data viz */
.chart{width:100%;height:auto;background:var(--surface);border-radius:10px}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin:.5rem 0 0;font-size:.82rem;color:var(--ink-2)}
.legend span{display:inline-flex;gap:.4rem;align-items:center}
.swatch{width:12px;height:12px;border-radius:3px;flex:none}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat b{display:block;font-size:1.5rem;color:#0f172a;font-variant-numeric:tabular-nums}
.stat span{font-size:.78rem;color:var(--muted)}
.heatstrip{display:flex;gap:3px;flex-wrap:wrap}
.heatcell{width:16px;height:16px;border-radius:4px;background:var(--slate-soft);border:1px solid var(--line-2)}

/* week strip */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.week .d{border:1px solid var(--line);border-radius:10px;padding:7px 4px;text-align:center;font-size:.72rem;background:var(--surface);min-height:62px;display:flex;flex-direction:column;gap:4px;align-items:center}
.week .d .dn{font-weight:700;color:var(--muted)}
.week .d.today{border-color:var(--brand-2);box-shadow:0 0 0 2px #cdeeeb}
.week .d .mk{width:9px;height:9px;border-radius:50%;background:var(--line)}
.week .d .mk.done{background:var(--brand)}
.week .d .mk.plan{background:var(--blue-soft);border:1px solid var(--blue)}
.week .d .tiny{font-size:.62rem;line-height:1.1}

/* list rows */
.row{display:flex;gap:10px;align-items:center;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.row+.row{margin-top:8px}
.row .rmain{flex:1;min-width:0}
.row .rmain .t{font-weight:700;font-size:.95rem}
.row .rmain .s{font-size:.8rem;color:var(--muted)}
.row .rt{font-variant-numeric:tabular-nums;font-weight:700;color:var(--ink-2);white-space:nowrap}

/* preset groups */
.acc{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.acc+.acc{margin-top:10px}
.acc>summary{list-style:none;cursor:pointer;padding:13px 14px;font-weight:700;display:flex;align-items:center;gap:.5rem}
.acc>summary::-webkit-details-marker{display:none}
.acc>summary .chev{margin-left:auto;transition:transform .15s;color:var(--faint)}
.acc[open]>summary .chev{transform:rotate(90deg)}
.acc .body{padding:0 14px 14px}
.preset{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);cursor:pointer;width:100%;text-align:left;font:inherit}
.preset+.preset{margin-top:8px}
.preset:hover{border-color:var(--brand-2);background:#fff}
.preset .pi{flex:1;min-width:0}
.preset .pi .pt{font-weight:700;font-size:.92rem}
.preset .pi .ps{font-size:.78rem;color:var(--muted)}
.preset .go{color:var(--brand);flex:none}

/* modal / sheet */
.scrim{position:fixed;inset:0;background:rgba(15,23,42,.5);backdrop-filter:blur(2px);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.sheet{background:var(--surface);border-radius:18px;box-shadow:var(--shadow-lg);width:100%;max-width:560px;max-height:92vh;max-height:92dvh;overflow:auto;padding:20px}
.sheet.wide{max-width:720px}
.sheet h2{margin-top:0}
.sheet-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.sheet-head h2{margin:0;flex:1}
/* full-screen session player */
.player{position:fixed;inset:0;z-index:60;background:linear-gradient(180deg,#f7fbfb,#eef4f8);display:flex;flex-direction:column;padding:16px;padding-bottom:calc(16px + var(--safe-b));overflow:auto}
.player .phead{display:flex;align-items:center;gap:10px}
.player .phead .nm{font-weight:800;font-size:1.05rem}
.player .pbody{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px;max-width:540px;margin:0 auto;width:100%}
.phase-cue{text-align:center;font-size:1.05rem;color:var(--ink-2);min-height:1.6em}
.phase-name{text-align:center;font-weight:800;font-size:1.2rem}
.phase-meta{text-align:center;color:var(--muted);font-size:.85rem}
.counters{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.counter{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px;display:flex;align-items:center;gap:10px}
.counter b{font-size:1.1rem;font-variant-numeric:tabular-nums;min-width:1.4ch;text-align:center}
.counter .cbtns{display:flex;flex-direction:column}
.pcontrols{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.metrodot{width:12px;height:12px;border-radius:50%;background:var(--brand-2);opacity:.25;transition:opacity .06s,transform .06s}
.metrodot.on{opacity:1;transform:scale(1.5)}
.phase-track{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;margin-top:6px}
.phase-track i{width:22px;height:6px;border-radius:3px;background:var(--line)}
.phase-track i.done{background:var(--brand-2)}
.phase-track i.now{background:var(--brand);box-shadow:0 0 0 2px #cdeeeb}

.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 16px + var(--safe-b));transform:translateX(-50%);background:#0f172a;color:#fff;padding:.7rem 1rem;border-radius:11px;font-size:.9rem;z-index:80;box-shadow:var(--shadow-lg);max-width:92vw;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(min-width:900px){.toast{bottom:28px}}

.empty{text-align:center;color:var(--muted);padding:26px 14px;border:1px dashed var(--line);border-radius:12px;background:var(--surface-2)}
.empty .icon{width:2rem;height:2rem;margin:0 auto .5rem;color:var(--faint)}

.shieldwrap{position:fixed;inset:0;z-index:90;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px}
.shieldcard{max-width:380px;text-align:center}
.shieldcard .logo{width:56px;height:56px;border-radius:15px;background:linear-gradient(135deg,var(--brand),var(--blue));display:grid;place-items:center;color:#fff;margin:0 auto 14px}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{.topbar,.tabbar,.rail,.btn,.iconbtn{display:none!important}}
</style>
</head>
<body>
<noscript><div style="padding:24px;max-width:600px;margin:0 auto"><h1>JavaScript required</h1><p>This training toolkit runs entirely in your browser and needs JavaScript enabled. No data is ever sent anywhere; everything is stored locally on your device.</p></div></noscript>

<div id="app" class="app hidden">
  <header class="topbar">
    <div class="brand-mark"><span class="logo" aria-hidden="true"><svg class="icon" viewBox="0 0 24 24"><path d="M3 12h4l2 5 4-12 2 7h6"/></svg></span><span>Angion Toolkit</span></div>
    <span class="sp"></span>
    <span class="daypill" id="dayPill"></span>
    <button class="iconbtn" id="btnLock" title="Lock" aria-label="Lock app" hidden><svg class="icon" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></button>
  </header>

  <div class="shell">
    <aside class="rail" aria-label="Primary">
      <nav id="railNav"></nav>
      <div class="railfoot">
        <p style="margin:0 0 .4rem"><b>Private &amp; offline.</b> Everything stays in this browser.</p>
        <a href="angion-method-illustrated-guide.html">Open the illustrated guide →</a>
      </div>
    </aside>
    <main id="main" tabindex="-1"></main>
  </div>

  <nav class="tabbar" id="tabbar" aria-label="Primary"></nav>
</div>

<div id="modalRoot"></div>
<div id="playerRoot"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
(function () {
/* =========================================================================
   Angion Training Toolkit & Logger — single-file, offline, private.
   All data is stored in localStorage on this device only. No network calls.
   ========================================================================= */

/* ---------------- tiny DOM + util helpers ---------------- */
var D = document;
function el(sel, root) { return (root || D).querySelector(sel); }
function els(sel, root) { return Array.prototype.slice.call((root || D).querySelectorAll(sel)); }
function h(tag, attrs, kids) {
  var n = D.createElement(tag); attrs = attrs || {};
  for (var k in attrs) {
    if (!Object.prototype.hasOwnProperty.call(attrs, k)) continue;
    var v = attrs[k];
    if (v == null || v === false) continue;
    if (k === "class") n.className = v;
    else if (k === "html") n.innerHTML = v;
    else if (k === "text") n.textContent = v;
    else if (k === "dataset") { for (var d in v) n.dataset[d] = v[d]; }
    else if (k.slice(0, 2) === "on" && typeof v === "function") n.addEventListener(k.slice(2), v);
    else if (v === true) n.setAttribute(k, "");
    else n.setAttribute(k, v);
  }
  if (kids != null) {
    if (!Array.isArray(kids)) kids = [kids];
    kids.forEach(function (c) { if (c == null || c === false) return; n.appendChild(typeof c === "string" || typeof c === "number" ? D.createTextNode(String(c)) : c); });
  }
  return n;
}
function clear(n) { while (n && n.firstChild) n.removeChild(n.firstChild); return n; }
